  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const initData = tg ? tg.initData : "";

    // Automatically resolve backend URL (works in sandboxed previews & Render deployment)
    const API_BASE = (window.location.protocol === "blob:" || !window.location.origin || window.location.origin === "null")
      ? "https://auto-bot-y054.onrender.com"
      : window.location.origin;

    let APP = {
      user: {}, categories: [], products: [], settings: {},
      currency: localStorage.getItem("cn_curr") || "BDT",
      theme: localStorage.getItem("cn_theme") || "light",
      selectedCat: "all",
      favorites: JSON.parse(localStorage.getItem("cn_favs") || "[]"),
      activeProduct: null,
      discountPct: 0,
      appliedCoupon: ""
    };

    if (APP.theme === "dark") document.body.classList.add("dark");

    async function api(path, body = null) {
      const fullUrl = path.startsWith("http") ? path : (API_BASE + path);
      const opts = {
        method: body ? "POST" : "GET",
        headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData }
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(fullUrl, opts);
      return await res.json();
    }
